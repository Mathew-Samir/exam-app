<div class="form-container" [formGroup]="forgetForm">
  <app-input
       formControlName="email"
       label="Email"
       type="email"
       placeholder="user@example.com"
       required
   />
<div class="btn-container">
  <app-button label="Continue" (click)="onSubmit()" [disabled]="forgetForm.invalid"></app-button>
</div>
  <p class="dont-have-account">
    Don’t have an account? <a routerLink="/signup">Create yours</a>
  </p>

</div>
