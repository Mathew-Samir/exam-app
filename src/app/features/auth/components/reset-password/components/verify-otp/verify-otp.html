<div class="OTP-container" [formGroup]="otpForm">
    <p-inputotp [formControl]="$any(otpForm.controls.otp)" [length]="6"/>

    <p class="auth-description">
      Didn't receive code?
      @if (countdown() > 0) {
        <span>Resend in {{ countdown() }}s</span>
      } @else {
        <button class="btn-resend" (click)='onResend()'>Resend</button>
      }
    </p>
</div>
<div class="btn-container">
  <app-button label="Verify Code" (click)="onVerify()"  [disabled]="otpForm.invalid"></app-button>
</div>
  <p class="dont-have-account">
    Ready to login? <a routerLink="/login">Login</a>
  </p>
